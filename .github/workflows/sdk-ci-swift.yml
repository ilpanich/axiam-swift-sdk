name: sdk-ci-swift

on:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  build-test:
    name: build & test (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-jammy
    strategy:
      fail-fast: false
      matrix:
        # The gating matrix is floor + newest. The floor is the
        # `swift-tools-version` in Package.swift (5.9); the newest is the
        # latest Swift with an official Linux image (6.3 — 6.4 exists for
        # Apple platforms but has no Linux container yet).
        #
        # These two legs do NOT compile the same way, and that is the point.
        # SwiftPM picks the manifest by toolchain: 5.9 sees only Package.swift
        # and builds in Swift 5 language mode, while 6.3 picks up
        # Package@swift-6.0.swift and builds this package's targets in **Swift 6
        # language mode**, where the strict-concurrency rules are errors rather
        # than warnings. So the floor leg proves the SDK still builds for
        # consumers on 5.9, and the newest leg proves it is actually
        # data-race-safe rather than merely un-analysed.
        #
        # 5.10 sits between two green legs. PackageManifestParityTests fails
        # the build if the two manifests ever describe different packages.
        swift: ['5.9', '6.3']
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Says out loud which manifest SwiftPM selected — 5.9 on the floor leg,
      # 6.0 on the newest — so a leg that silently fell back to Package.swift,
      # and therefore tested nothing it was added to test, is visible in the log
      # rather than just green.
      #
      # A bare command, not a script: these containers run steps under `sh -e`
      # (dash), where `set -o pipefail` is an error.
      - name: Manifest in effect (tools-version selected by this toolchain)
        run: swift package tools-version

      - name: Build
        run: swift build

      - name: Test (with coverage)
        run: swift test --enable-code-coverage

  management-drift-check:
    name: §27 management surface drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The §27 surface — 114 model structs, 22 enums, 24 namespace handles over 146
      # operations and a generated conformance suite, ~17k lines — is produced by
      # Scripts/gen_management.py from the VENDORED management-registry.json and
      # openapi.json, and the output is committed so `swift build` needs no code-generation
      # step and no Python.
      #
      # Committed generated code is only trustworthy if something checks it is current.
      # The registry is maintained in ilpanich/axiam and re-vendored here; without this gate
      # a re-vendor that adds an operation would leave the SDK shipping a surface that
      # disagrees with the contract it claims to implement — and every test would still
      # pass, because the generated tests come from the same stale copy. §27.8 requires
      # exactly this check.
      #
      # Deliberately installs nothing: the generator imports only the standard library, and
      # the runner ships a python3 new enough to run it. Adding setup-python here would make
      # a contract gate depend on an action's availability for no gain.
      #
      # Runs OUTSIDE the swift container, unlike build-test: the swift:jammy images are
      # minimal and this needs a python3, not a swiftc.
      - name: Verify the committed §27 surface matches the vendored contract
        run: |
          python3 --version
          python3 Scripts/gen_management.py --check

  tls-bypass-gate:
    name: TLS-bypass lint gate (§6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Sources for TLS-bypass patterns
        run: |
          set -euo pipefail
          # §6: no API surface may weaken TLS verification. Mirror the other SDKs' gates.
          PATTERN='InsecureSkipVerify|rejectUnauthorized|allowInsecure|allow_insecure|skip_?tls|disableTLS|disable_tls|verifyPeer\(false\)|certificateVerification[[:space:]]*=[[:space:]]*\.none|\.none[[:space:]]*//?[[:space:]]*trustRoots|trustRoots[[:space:]]*=[[:space:]]*\.none|noHostnameVerification|verify=False'
          if grep -REn "$PATTERN" Sources/; then
            echo "::error::Forbidden TLS-bypass pattern found in Sources/ (§6 prohibits any verification-weakening surface)."
            exit 1
          fi
          echo "OK: no TLS-bypass patterns in Sources/."

  secret-scan-gate:
    name: no committed private keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no private keys are committed
        run: |
          set -euo pipefail
          if git grep -nE "BEGIN (RSA |EC |OPENSSL |ENCRYPTED )?PRIVATE KEY" -- . ; then
            echo "::error::A private key appears to be committed. Test PKI must be generated at runtime."
            exit 1
          fi
          echo "OK: no private keys committed."

  verify-tag-on-main:
    name: verify tag is on main
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert tagged commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=0 || git fetch origin main
          if git branch -r --contains "${GITHUB_SHA}" | grep -qE 'origin/main$'; then
            echo "OK: tagged commit is reachable from origin/main."
          else
            echo "::error::Release tags must point at a commit on main."
            exit 1
          fi

  release:
    name: release (SwiftPM tag-is-release)
    runs-on: ubuntu-latest
    needs: [build-test, tls-bypass-gate, secret-scan-gate, verify-tag-on-main]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: SwiftPM release note
        run: |
          echo "SwiftPM has no registry publish step — the git tag ${GITHUB_REF_NAME} IS the release."
          echo "Consumers resolve it via .package(url:from:) automatically."
      - name: CocoaPods trunk push (optional)
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]; then
            echo "COCOAPODS_TRUNK_TOKEN not set — skipping pod trunk push."
            exit 0
          fi
          echo "Would run: pod trunk push AxiamSDK.podspec --allow-warnings"
